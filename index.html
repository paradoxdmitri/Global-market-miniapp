<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>GLOBAL MARKET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:22px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-size:21px;font-weight:900;letter-spacing:2px}
.logo span{color:#999}
.profile{background:#202020;border:1px solid #333;padding:11px;border-radius:50%}
h1{font-size:29px;margin:0 0 9px}
.subtitle{color:#888;font-size:13px}
.banner{margin:24px 0;background:linear-gradient(120deg,#292929,#101010);border:1px solid #444;border-radius:18px;padding:22px}
.banner small{color:#aaa;letter-spacing:2px}
.banner h2{font-size:24px;margin:12px 0}
.banner p{color:#aaa;font-size:13px}
.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}
.section h3{margin:0;font-size:18px}
.section span{color:#888;font-size:12px}
.search{width:100%;padding:15px;background:#171717;border:1px solid #333;border-radius:12px;color:white;font-size:14px;outline:none}
.filters{display:flex;gap:9px;margin:15px 0;overflow:auto}
.filter{padding:10px 15px;border-radius:20px;background:#171717;color:#aaa;border:1px solid #333;white-space:nowrap}
.filter.active{background:#eee;color:#111}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:#151515;border:1px solid #292929;border-radius:15px;padding:12px}
.gift{height:115px;background:linear-gradient(145deg,#292929,#101010);border-radius:10px;display:grid;place-items:center;font-size:43px}
.product h4{font-size:14px;margin:12px 0 6px}
.price{color:#ddd;font-weight:bold;font-size:14px}
.muted{color:#777;font-size:11px;margin-top:5px}
button{cursor:pointer}
.buy{width:100%;padding:11px;margin-top:12px;border:1px solid #777;border-radius:9px;background:#eee;color:#111;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #292929;display:flex;justify-content:space-around;padding:15px 5px;color:#aaa;font-size:11px}
nav div{text-align:center}
nav b{display:block;font-size:19px;margin-bottom:4px}
.empty{display:none;color:#888;text-align:center;padding:25px}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header>
<div class="logo">GLOBAL <span>MARKET</span></div>
<div class="profile">◉</div>
</header>

<h1>Маркетплейс<br>Telegram Gifts</h1>
<div class="subtitle">Коллекционные подарки в одном месте.</div>

<div class="banner">
<small>GLOBAL MARKET</small>
<h2>Твой мир<br>цифровых коллекций.</h2>
<p>Находи интересные подарки и изучай предложения рынка.</p>
</div>

<div class="section">
<h3>Каталог</h3>
<span>DEMO VERSION</span>
</div>

<input class="search" id="search" placeholder="⌕  Поиск подарков...">

<div class="filters">
<button class="filter active" onclick="filter('all',this)">Все</button>
<button class="filter" onclick="filter('offers',this)">С предложениями</button>
</div>

<div class="products" id="products"></div>
<div class="empty" id="empty">Ничего не найдено</div>

<nav>
<div><b>⌂</b>Главная</div>
<div><b>◇</b>Каталог</div>
<div><b>♧</b>Избранное</div>
<div><b>◉</b>Профиль</div>
</nav>

<script>
const search = document.getElementById('search');
const products = document.getElementById('products');
let gifts = [];
let offers = [];
let currentFilter = 'all';

function filter(type, button) {
    currentFilter = type;
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    render();
}

function render() {
    const query = search.value.trim().toLowerCase();
    products.innerHTML = '';
    let count = 0;

    gifts.forEach(gift => {
        const matches = offers.filter(o =>
            String(o.gift || '').toLowerCase() === String(gift.name || '').toLowerCase()
        );

        if (!String(gift.name || '').toLowerCase().includes(query)) return;
        if (currentFilter === 'offers' && matches.length === 0) return;

        const card = document.createElement('div');
        card.className = 'product';

        if (gift.photo) {
            const img = document.createElement('img');
            img.src = gift.photo;
            img.alt = gift.name;
            img.style.cssText = 'width:100%;height:115px;object-fit:contain';
            card.appendChild(img);
        } else {
            const visual = document.createElement('div');
            visual.className = 'gift';
            visual.textContent = '🎁';
            card.appendChild(visual);
        }

        const title = document.createElement('h4');
        title.textContent = gift.name;
        card.appendChild(title);

        const price = document.createElement('div');
        price.className = 'muted';
        price.style.whiteSpace = 'pre-line';

        if (matches.length) {
            price.textContent = matches.map(o =>
                `${o.quantity} шт. — ${o.price} ${o.currency}`
            ).join('\n');
        } else {
            price.textContent = 'Пока нет предложений';
        }
        card.appendChild(price);

        const button = document.createElement('button');
        button.className = 'buy';
        button.textContent = 'Подробнее';
        button.onclick = () => {
            alert(matches.length
                ? `${gift.name}\n\n${price.textContent}`
                : `${gift.name}\nПока нет предложений`);
        };
        card.appendChild(button);

        products.appendChild(card);
        count++;
    });

    document.getElementById('empty').style.display = count ? 'none' : 'block';
}

async function loadCatalog() {
    try {
        const response = await fetch('./catalog.json');
        if (!response.ok) throw new Error('Каталог не найден');
        const data = await response.json();
        gifts = data.gifts || [];
        offers = data.offers || [];
        render();
    } catch (error) {
        products.textContent = 'Не удалось загрузить каталог.';
        console.error(error);
    }
}

search.addEventListener('input', render);
loadCatalog();
</script>

<script>
if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    if (tg.themeParams.bg_color) {
        document.body.style.background = tg.themeParams.bg_color;
    }

    console.log("GLOBAL MARKET: Telegram WebApp connected");
}
</script>

</body>
</html>
